<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a237e">
  <meta name="description" content="Laporan absensi ZIP desa dan kelurahan.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Absensi ZIP Desa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 750px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { text-align: center; color: #1a237e; margin: 0 0 16px; font-size: 20px; }
    
    .filter { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
    
    /* CSS PROGRESS BAR PERSENTASE */
    .loading-wrapper { 
      display: none; 
      margin-bottom: 16px; 
      background: #f9f9f9;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .loading-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #1a237e;
      margin-bottom: 6px;
    }
    .loading-bar-container { 
      width: 100%; 
      background-color: #e0e0e0; 
      border-radius: 4px; 
      height: 10px; 
      overflow: hidden; 
    }
    .loading-bar { 
      width: 0%; 
      height: 100%; 
      background-color: #1a237e; 
      border-radius: 4px; 
      transition: width 0.1s linear;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .report-title { margin: 0 0 12px; color: #1a237e; font-size: 18px; text-align: center; }
    .report-title span { display: block; margin-top: 4px; font-size: 14px; }
    .report-credit { margin: 12px 0 0; color: #666; font-size: 12px; text-align: center; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #e0e0e0; text-align: left; }
    th { background: #1a237e; color: #fff; font-size: 12px; }
    
    .lengkap { color: #2e7d32; font-weight: bold; }
    .kosong { color: #c62828; font-weight: bold; font-style: italic; }
    
    .total-row td { font-weight: bold; background: #e8eaf6; border-top: 2px solid #1a237e; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .actions button, .actions a { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; min-width: 140px; text-align: center; text-decoration: none; }
    .btn-download { background: #2e7d32; }
    .btn-share { background: #25d366; }
    .btn-dukops { background: #1a237e; }
    .btn-install {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 1000;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: #ef6c00;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-install[hidden] { display: none; }
    .status { margin-top: 10px; text-align: center; font-size: 13px; color: #555; }
    .text-loading { text-align: center; padding: 20px; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <div id="laporanGambar">
      <h2 class="report-title">Laporan Absensi Dukops<span id="judulPeriode"></span></h2>
      <div class="filter">
        <select id="bulan" onchange="muatData()">
          <option value="">-- Pilih Bulan --</option>
          <option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option><option>Desember</option>
        </select>
        <select id="tahun" onchange="muatData()"></select>
      </div>

      <!-- LOADING PROGRESS BAR -->
      <div class="loading-wrapper" id="loadingWrapper">
        <div class="loading-text-row">
          <span>⏳ Memuat data...</span>
          <span id="persenText">0%</span>
        </div>
        <div class="loading-bar-container">
          <div class="loading-bar" id="loadingBar"></div>
        </div>
      </div>

      <table id="tabelAbsensi">
        <thead>
          <tr><th>No</th><th>Desa / Kelurahan</th><th>Laporan</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="3" class="text-loading">⏳ Memuat data...</td></tr>
        </tbody>
      </table>
      <p class="report-credit">Developer @I Nyoman Arta 2026</p>
    </div>
    
    <div class="actions">
      <button class="btn-download" id="btnDownload" onclick="downloadLaporan()" disabled>📥 Download PNG</button>
      <button class="btn-share" id="btnShare" onclick="shareWhatsApp()" disabled>💬 Share WhatsApp</button>
      <a class="btn-dukops" href="https://buleleng01.pages.dev/" target="_blank" rel="noopener noreferrer">🌐 APLIKASI DUKOPS01</a>
    </div>
    <div class="status" id="status"></div>
  </div>
  <button class="btn-install" id="btnInstall" type="button" onclick="installAplikasi()" hidden>📲 Install Aplikasi</button>
  
  <script>
    let deferredInstallPrompt = null;

    function aplikasiTerpasang() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || navigator.standalone === true;
    }

    function perbaruiTombolInstall() {
      const tombol = document.getElementById('btnInstall');
      if (tombol) tombol.hidden = aplikasiTerpasang() || !window.isSecureContext || !('serviceWorker' in navigator);
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      perbaruiTombolInstall();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      perbaruiTombolInstall();
      setStatus('Aplikasi berhasil diinstal.');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }

    // 🔴 URL API BARU ANDA
    const API_URL = 'https://script.google.com/macros/s/AKfycbxylYiKACQTVM2eLImVQXJTIed2YT-keFcHXC_w091CsE_l8K6xsRaeNTEMnf5g0Qrx/exec';
    const WILAYAH_URL = 'https://raw.githubusercontent.com/lprnbbs2026-hue/BULELENG01/main/data/desa/desa%20dan%20kelurahan.json';
    const CACHE_NAME = 'absensi-v2';
    let loadingInterval;

    function normalisasiJenis(jenis) {
      return String(jenis).toLowerCase().includes('kelurahan') || String(jenis).toLowerCase() === 'kel'
        ? 'Kelurahan'
        : 'Desa';
    }

    function kunciWilayah(jenis, nama) {
      return `${normalisasiJenis(jenis)}:${String(nama).trim().toLocaleLowerCase('id')}`;
    }

    function setStatus(message, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#c62828' : '#555';
    }

    async function installAplikasi() {
      if (aplikasiTerpasang()) {
        perbaruiTombolInstall();
        return;
      }
      if (!deferredInstallPrompt) {
        const perangkatMobile = navigator.userAgentData
          ? navigator.userAgentData.mobile
          : /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const petunjuk = perangkatMobile
          ? 'buka menu browser lalu pilih "Tambahkan ke layar utama" atau "Instal aplikasi"'
          : 'klik ikon instal di bilah alamat Chrome/Edge, atau buka menu browser lalu pilih "Instal aplikasi"';
        setStatus(`Untuk memasang, ${petunjuk}.`);
        return;
      }

      try {
        await deferredInstallPrompt.prompt();
        const pilihan = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        if (pilihan.outcome === 'accepted') {
          setStatus('Aplikasi sedang dipasang.');
        } else {
          setStatus('Instalasi aplikasi dibatalkan.');
        }
      } catch (err) {
        setStatus(`Gagal memulai instalasi: ${err.message}`, true);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      perbaruiTombolInstall();
      const now = new Date();
      const selTahun = document.getElementById('tahun');
      for (let y = now.getFullYear(); y >= 2020; y--) {
        const o = document.createElement('option'); o.value = y; o.textContent = y; selTahun.appendChild(o);
      }
      selTahun.value = now.getFullYear();
      document.getElementById('bulan').selectedIndex = now.getMonth() + 1;
      muatData();
    });

    function mulaiLoading() {
      const wrapper = document.getElementById('loadingWrapper');
      const bar = document.getElementById('loadingBar');
      const text = document.getElementById('persenText');
      
      wrapper.style.display = 'block';
      let progress = 0;
      bar.style.width = '0%';
      text.textContent = '0%';
      
      loadingInterval = setInterval(() => {
        if (progress < 90) {
          progress += 1;
          bar.style.width = progress + '%';
          text.textContent = progress + '%';
        }
      }, 30);
    }

    function selesaiLoading() {
      clearInterval(loadingInterval);
      const wrapper = document.getElementById('loadingWrapper');
      const bar = document.getElementById('loadingBar');
      const text = document.getElementById('persenText');
      
      bar.style.width = '100%';
      text.textContent = '100%';
      
      setTimeout(() => {
        wrapper.style.display = 'none';
      }, 500);
    }

    async function muatData() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      if (!bulan) return;
      document.getElementById('judulPeriode').textContent = `Bulan ${bulan} ${tahun}`;
      
      const btnDownload = document.getElementById('btnDownload');
      const btnShare = document.getElementById('btnShare');
      btnDownload.disabled = true;
      btnShare.disabled = true;
      setStatus('Memuat data...');
      document.getElementById('tbody').innerHTML = '<tr><td colspan="3" class="text-loading">⏳ Memuat data...</td></tr>';
      
      mulaiLoading();
      
      try {
        const [res, wilayahRes] = await Promise.all([
          fetch(`${API_URL}?action=getAbsensi&year=${tahun}&month=${bulan}`, { cache: 'no-store' }),
          fetch(WILAYAH_URL)
        ]);
        if (!res.ok) throw new Error(`Server absensi merespons ${res.status}`);
        if (!wilayahRes.ok) throw new Error(`Server data wilayah merespons ${wilayahRes.status}`);

        const [json, daftarWilayah] = await Promise.all([res.json(), wilayahRes.json()]);
        if (!json.success) throw new Error(json.error || 'Data tidak tersedia');
        if (!Array.isArray(daftarWilayah)) throw new Error('Format daftar wilayah tidak valid');
        
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        const data = Array.isArray(json.data) ? json.data : [];
        const dataByKey = new Map(data.map(it => [kunciWilayah(it.jenis, it.desa), it]));
        const wilayah = daftarWilayah.map(namaFile => {
          const match = /^(Desa|Kelurahan) (.+)\.txt$/i.exec(namaFile);
          if (!match) throw new Error(`Nama wilayah tidak valid: ${namaFile}`);
          const jenis = normalisasiJenis(match[1]);
          const desa = match[2];
          const laporan = dataByKey.get(kunciWilayah(jenis, desa));
          dataByKey.delete(kunciWilayah(jenis, desa));
          return { jenis, desa, jumlahZip: Number(laporan?.jumlahZip) || 0 };
        });

        dataByKey.forEach((laporan) => {
          wilayah.push({
            jenis: normalisasiJenis(laporan.jenis),
            desa: laporan.desa,
            jumlahZip: Number(laporan.jumlahZip) || 0
          });
        });
        
        if (!wilayah.length) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-loading">Tidak ada data wilayah.</td></tr>';
          setStatus('Tidak ada data untuk bulan yang dipilih.');
        } else {
          let total = 0;
          wilayah.forEach((it, i) => {
            total += it.jumlahZip;
            const tr = document.createElement('tr');
            const warnaStatus = it.jumlahZip > 0 ? 'lengkap' : 'kosong';
            const nomor = document.createElement('td');
            nomor.textContent = i + 1;
            const namaWilayah = document.createElement('td');
            namaWilayah.textContent = `${it.jenis === 'Kelurahan' ? 'KEL' : 'DESA'} ${it.desa.toLocaleUpperCase('id')}`;
            const jumlah = document.createElement('td');
            jumlah.className = warnaStatus;
            const jumlahTeks = document.createElement('strong');
            jumlahTeks.textContent = `${it.jumlahZip} Laporan`;
            jumlah.appendChild(jumlahTeks);
            tr.append(nomor, namaWilayah, jumlah);
            tbody.appendChild(tr);
          });
          
          const trTotal = document.createElement('tr');
          trTotal.className = 'total-row';
          trTotal.innerHTML = `<td colspan="2"><strong>TOTAL (${wilayah.length} wilayah)</strong></td><td><strong>${total} Laporan</strong></td>`;
          tbody.appendChild(trTotal);
          setStatus(`${total} laporan ditemukan untuk ${bulan} ${tahun}.`);
        }
        btnDownload.disabled = false;
        btnShare.disabled = false;
      } catch (err) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="3" class="text-loading" style="color:red;">Gagal: ${err.message}</td></tr>`;
        setStatus(`Gagal memuat data: ${err.message}`, true);
        btnDownload.disabled = true;
        btnShare.disabled = true;
      } finally {
        selesaiLoading();
      }
    }

    async function downloadLaporan() {
      try {
        const canvas = await html2canvas(document.getElementById('laporanGambar'), {
          scale: 2,
          backgroundColor: '#ffffff',
          onclone: clonedDocument => {
            clonedDocument.querySelector('#laporanGambar .filter').style.display = 'none';
            clonedDocument.getElementById('loadingWrapper').style.display = 'none';
          }
        });
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((result) => {
            if (result) resolve(result);
            else reject(new Error('Tidak dapat membuat gambar laporan.'));
          }, 'image/png');
        });
        const fileName = `Absensi_${document.getElementById('bulan').value}_${document.getElementById('tahun').value}.png`;
        
        const link = document.createElement('a');
        const imageUrl = URL.createObjectURL(blob);
        link.href = imageUrl;
        link.download = fileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(imageUrl), 1000);
        setStatus(`File ${fileName} berhasil disimpan.`);
      } catch (err) {
        setStatus(`Gagal membuat file: ${err.message}`, true);
      }
    }

    function shareWhatsApp() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      const baris = Array.from(document.querySelectorAll('#tbody tr'))
        .filter(tr => !tr.classList.contains('total-row'))
        .map(tr => Array.from(tr.cells, cell => cell.textContent.trim()));
      const totalBaris = document.querySelector('#tbody .total-row');
      const total = totalBaris ? totalBaris.cells[1].textContent.trim() : '0 Laporan';
      const rincian = baris
        .filter(cells => cells.length === 3 && /^\d+$/.test(cells[0]))
        .map(cells => `${cells[0]}. ${cells[1]}: ${cells[2]}`);
      const pemisah = '++++++++++++++++++++++';
      const pesan = [
        'Laporan Absensi Dukops',
        pemisah,
        `Bulan ${bulan} ${tahun}`,
        `Total ${total}`,
        pemisah,
        '',
        ...rincian
      ].join('\n');
      const url = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
      setStatus('Pesan laporan siap dikirim melalui WhatsApp.');
    }
  </script>
</body>
</html>
