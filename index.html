<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi ZIP Desa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 750px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { text-align: center; color: #1a237e; margin: 0 0 10px; font-size: 20px; }
    .btn-jadwal { display: block; text-align: center; background: #ff6f00; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 16px; font-size: 14px; }
    .filter { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #e0e0e0; text-align: left; }
    th { background: #1a237e; color: #fff; font-size: 12px; }
    .lengkap { color: #2e7d32; font-weight: bold; }
    .kosong { color: #757575; font-style: italic; }
    .total-row td { font-weight: bold; background: #e8eaf6; border-top: 2px solid #1a237e; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; min-width: 140px; }
    .btn-download { background: #2e7d32; }
    .btn-telegram { background: #0088cc; }
    .status { margin-top: 10px; text-align: center; font-size: 13px; color: #555; }
    .loading { text-align: center; padding: 20px; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Laporan Absensi ZIP</h2>
    <a href="jadwal.html" class="btn-jadwal">👮 Lihat Jadwal Jaga</a>
    <div class="filter">
      <select id="bulan" onchange="muatData()">
        <option value="">-- Pilih Bulan --</option>
        <option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option><option>Desember</option>
      </select>
      <select id="tahun" onchange="muatData()"></select>
    </div>
    <table>
      <thead><tr><th>No</th><th>Desa / Kelurahan</th><th>ZIP</th><th>Status</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="4" class="loading">⏳ Memuat data...</td></tr></tbody>
    </table>
    <div class="actions">
      <button class="btn-download" id="btnDownload" onclick="downloadDanShare()" disabled>📥 Download & Share</button>
      <button class="btn-telegram" id="btnTelegram" onclick="kirimTelegram()" disabled>📤 Kirim Telegram</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script>
    // URL API BARU
    const API_URL = 'https://script.google.com/macros/s/AKfycbyD8OQXyy8sXWQv-tZi5h0ZuRxpHEsX3y6w--ttE9eLEkpF0qqo8X_pkwTNS1lW2TTc/exec';
    
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const selTahun = document.getElementById('tahun');
      for (let y = now.getFullYear(); y >= 2020; y--) {
        const o = document.createElement('option'); o.value = y; o.textContent = y; selTahun.appendChild(o);
      }
      selTahun.value = now.getFullYear();
      document.getElementById('bulan').selectedIndex = now.getMonth() + 1;
      muatData();
    });
    async function muatData() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      if (!bulan) return;
      document.getElementById('btnDownload').disabled = true;
      document.getElementById('btnTelegram').disabled = true;
      document.getElementById('tbody').innerHTML = '<tr><td colspan="4" class="loading">⏳ Memuat...</td></tr>';
      try {
        const res = await fetch(`${API_URL}?action=getAbsensi&year=${tahun}&month=${bulan}`, { cache: 'no-store' });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        const data = json.data || [];
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="loading">Tidak ada data.</td></tr>';
        } else {
          data.forEach((it, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${i+1}</td><td>${it.jenis === 'Kelurahan' ? 'KEL' : 'DESA'} ${it.desa}</td><td><strong>${it.jumlahZip}</strong></td><td class="${it.jumlahZip > 0 ? 'lengkap' : 'kosong'}">${it.jumlahZip > 0 ? '✅ Ada' : '⛔ Kosong'}</td>`;
            tbody.appendChild(tr);
          });
          const trTotal = document.createElement('tr');
          trTotal.className = 'total-row';
          trTotal.innerHTML = `<td colspan="2"><strong>TOTAL (${data.length} wilayah)</strong></td><td><strong>${json.total}</strong></td><td></td>`;
          tbody.appendChild(trTotal);
        }
        document.getElementById('btnDownload').disabled = false;
        document.getElementById('btnTelegram').disabled = false;
      } catch (err) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="4" class="loading" style="color:red;">Gagal: ${err.message}</td></tr>`;
      }
    }
    async function downloadDanShare() {
      const canvas = await html2canvas(document.querySelector('table'), { scale: 2, backgroundColor: '#ffffff' });
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const fileName = `Absensi_${document.getElementById('bulan').value}_${document.getElementById('tahun').value}.png`;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    }
    async function kirimTelegram() {
      document.getElementById('btnTelegram').disabled = true;
      document.getElementById('status').textContent = '⏳ Mengirim...';
      const canvas = await html2canvas(document.querySelector('table'), { scale: 2 });
      const base64 = canvas.toDataURL('image/png');
      const body = new URLSearchParams({ action: 'telegram', base64, bulan: document.getElementById('bulan').value, tahun: document.getElementById('tahun').value });
      const res = await fetch(API_URL, { method: 'POST', body });
      const json = await res.json();
      document.getElementById('status').textContent = json.message;
      document.getElementById('btnTelegram').disabled = false;
    }
  </script>
</body>
</html>
