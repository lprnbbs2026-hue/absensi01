<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a237e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <title>Absensi ZIP Desa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 700px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { text-align: center; color: #1a237e; margin-bottom: 16px; }
    .filter { display: flex; gap: 10px; margin-bottom: 16px; }
    .filter select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }

    #areaAbsensi { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fafafa; min-height: 120px; }
    #areaAbsensi h3 { margin: 0 0 6px; text-align: center; color: #1a237e; }
    #areaAbsensi p.sub { text-align: center; margin: 0 0 12px; color: #666; font-size: 13px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e0e0e0; text-align: left; }
    th { background: #1a237e; color: #fff; }
    tr:nth-child(even) { background: #f5f5f5; }
    .lengkap { color: #2e7d32; font-weight: bold; }
    .kosong  { color: #757575; font-style: italic; }
    .total-row td { font-weight: bold; background: #e8eaf6; border-top: 2px solid #1a237e; }

    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; min-width: 140px; }
    .btn-download { background: #2e7d32; }
    .btn-telegram { background: #0088cc; }
    .btn-install  { background: #ff6f00; }
    button:disabled { background: #bdbdbd !important; cursor: not-allowed; }

    .status { margin-top: 10px; text-align: center; font-size: 13px; color: #555; min-height: 20px; }
    .loading { text-align: center; padding: 20px; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Absensi ZIP Desa/Kelurahan</h2>

    <div class="filter">
      <select id="bulan" onchange="muatData()">
        <option value="">-- Pilih Bulan --</option>
        <option>Januari</option><option>Februari</option><option>Maret</option>
        <option>April</option><option>Mei</option><option>Juni</option>
        <option>Juli</option><option>Agustus</option><option>September</option>
        <option>Oktober</option><option>November</option><option>Desember</option>
      </select>
      <select id="tahun" onchange="muatData()"></select>
    </div>

    <div id="areaAbsensi">
      <h3>Laporan Absensi ZIP</h3>
      <p class="sub" id="periodeText">Memuat data...</p>
      <table>
        <thead>
          <tr><th>No</th><th>Desa / Kelurahan</th><th>Jumlah File ZIP</th><th>Status</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4" class="loading">⏳ Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn-download" id="btnDownload" onclick="downloadDanShare()" disabled>📥 Download & Share</button>
      <button class="btn-telegram" id="btnTelegram" onclick="kirimTelegram()" disabled>📤 Kirim Telegram</button>
      <button class="btn-install" id="btnInstall" onclick="installApp()" style="display:none;">📲 Install Aplikasi</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    // 🔴 GANTI dengan URL /exec Apps Script Anda
    const API_URL = 'https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec';

    // ============ INIT ============
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const selTahun = document.getElementById('tahun');
      for (let y = now.getFullYear(); y >= 2020; y--) {
        const o = document.createElement('option'); o.value = y; o.textContent = y;
        selTahun.appendChild(o);
      }
      selTahun.value = now.getFullYear();
      document.getElementById('bulan').selectedIndex = now.getMonth() + 1;
      muatData();
    });

    // ============ MUAT DATA ============
    async function muatData() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      const status = document.getElementById('status');
      if (!bulan) return;

      status.textContent = '⏳ Memuat data...';
      document.getElementById('btnDownload').disabled = true;
      document.getElementById('btnTelegram').disabled = true;
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="4" class="loading">⏳ Memuat...</td></tr>';
      document.getElementById('periodeText').textContent = `Periode: ${bulan} ${tahun}`;

      try {
        const res = await fetch(API_URL + '?action=getData', { cache: 'no-store' });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Gagal');
        renderTabel(json.data, bulan, tahun);
        document.getElementById('btnDownload').disabled = false;
        document.getElementById('btnTelegram').disabled = false;
        status.textContent = `✅ Data dimuat (${json.data.length} desa).`;
      } catch (err) {
        status.textContent = '❌ ' + err.message;
        document.getElementById('tbody').innerHTML =
          '<tr><td colspan="4" class="loading" style="color:#c62828;">Gagal memuat.</td></tr>';
      }
    }

    function renderTabel(data, bulan, tahun) {
      document.getElementById('periodeText').textContent = `Periode: ${bulan} ${tahun}`;
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="loading">Tidak ada sub-folder.</td></tr>';
        return;
      }
      let total = 0;
      data.forEach((it, i) => {
        total += it.jumlahZip;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${it.desa}</td>
          <td><strong>${it.jumlahZip}</strong> file</td>
          <td class="${it.jumlahZip > 0 ? 'lengkap' : 'kosong'}">
            ${it.jumlahZip > 0 ? '✅ Ada file' : '⛔ Kosong'}
          </td>`;
        tbody.appendChild(tr);
      });
      const trTotal = document.createElement('tr');
      trTotal.className = 'total-row';
      trTotal.innerHTML = `<td colspan="2"><strong>TOTAL</strong></td><td><strong>${total}</strong> file</td><td></td>`;
      tbody.appendChild(trTotal);
    }

    // ============ DOWNLOAD + SHARE ============
    async function downloadDanShare() {
      const area = document.getElementById('areaAbsensi');
      const status = document.getElementById('status');
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      status.textContent = '⏳ Membuat gambar...';

      try {
        const canvas = await html2canvas(area, { scale: 2, backgroundColor: '#fff' });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const fileName = `Absensi_${bulan}_${tahun}.png`;

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();

        if (navigator.canShare) {
          const file = new File([blob], fileName, { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: 'Absensi ZIP', text: `Absensi ${bulan} ${tahun}` });
              status.textContent = '✅ Gambar dibagikan.';
            } catch (e) {
              status.textContent = '📥 Terunduh. Share dibatalkan.';
            }
            return;
          }
        }
        window.open('https://wa.me/?text=' + encodeURIComponent(`Absensi ZIP ${bulan} ${tahun} - ${fileName}`), '_blank');
        status.textContent = '📥 Terunduh. WhatsApp dibuka.';
      } catch (err) {
        status.textContent = '❌ ' + err.message;
      }
    }

    // ============ KIRIM TELEGRAM ============
    async function kirimTelegram() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      const status = document.getElementById('status');
      document.getElementById('btnTelegram').disabled = true;
      status.textContent = '⏳ Mengirim ke Telegram...';

      try {
        const canvas = await html2canvas(document.getElementById('areaAbsensi'),
          { scale: 2, backgroundColor: '#fff' });
        const base64 = canvas.toDataURL('image/png');

        // form-encoded agar tidak kena CORS preflight
        const body = new URLSearchParams();
        body.append('action', 'telegram');
        body.append('base64', base64);
        body.append('bulan', bulan);
        body.append('tahun', tahun);

        const res = await fetch(API_URL, { method: 'POST', body });
        const json = await res.json();
        status.textContent = json.message;
      } catch (err) {
        status.textContent = '❌ ' + err.message;
      }
      document.getElementById('btnTelegram').disabled = false;
    }

    // ============ INSTALL PWA ============
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btnInstall').style.display = 'block';
    });

    async function installApp() {
      if (!deferredPrompt) {
        alert('Install tidak tersedia. Buka menu Chrome → "Install app" / "Tambahkan ke layar utama".');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('btnInstall').style.display = 'none';
      }
      deferredPrompt = null;
    }

    window.addEventListener('appinstalled', () => {
      document.getElementById('btnInstall').style.display = 'none';
    });

    // ============ REGISTER SERVICE WORKER ============
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('SW gagal:', err));
      });
    }
  </script>
</body>
</html>
