<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi ZIP Desa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 750px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { text-align: center; color: #1a237e; margin: 0 0 16px; font-size: 20px; }
    
    .filter { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
    
    /* CSS PROGRESS BAR PERSENTASE */
    .loading-wrapper { 
      display: none; 
      margin-bottom: 16px; 
      background: #f9f9f9;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .loading-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #1a237e;
      margin-bottom: 6px;
    }
    .loading-bar-container { 
      width: 100%; 
      background-color: #e0e0e0; 
      border-radius: 4px; 
      height: 10px; 
      overflow: hidden; 
    }
    .loading-bar { 
      width: 0%; 
      height: 100%; 
      background-color: #1a237e; 
      border-radius: 4px; 
      transition: width 0.1s linear;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #e0e0e0; text-align: left; }
    th { background: #1a237e; color: #fff; font-size: 12px; }
    
    .lengkap { color: #2e7d32; font-weight: bold; }
    .kosong { color: #c62828; font-weight: bold; font-style: italic; }
    
    .total-row td { font-weight: bold; background: #e8eaf6; border-top: 2px solid #1a237e; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; min-width: 140px; }
    .btn-download { background: #2e7d32; }
    .status { margin-top: 10px; text-align: center; font-size: 13px; color: #555; }
    .text-loading { text-align: center; padding: 20px; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Laporan Absensi ZIP</h2>
    
    <div class="filter">
      <select id="bulan" onchange="muatData()">
        <option value="">-- Pilih Bulan --</option>
        <option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option><option>Desember</option>
      </select>
      <select id="tahun" onchange="muatData()"></select>
    </div>

    <!-- LOADING PROGRESS BAR -->
    <div class="loading-wrapper" id="loadingWrapper">
      <div class="loading-text-row">
        <span>⏳ Memuat data...</span>
        <span id="persenText">0%</span>
      </div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
      </div>
    </div>

    <table id="tabelAbsensi">
      <thead>
        <tr><th>No</th><th>Desa / Kelurahan</th><th>Laporan</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="3" class="text-loading">⏳ Memuat data...</td></tr>
      </tbody>
    </table>
    
    <div class="actions">
      <button class="btn-download" id="btnDownload" onclick="downloadDanShare()" disabled>📥 Download & Share</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  
  <script>
    // 🔴 URL API BARU ANDA
    const API_URL = 'https://script.google.com/macros/s/AKfycbxylYiKACQTVM2eLImVQXJTIed2YT-keFcHXC_w091CsE_l8K6xsRaeNTEMnf5g0Qrx/exec';
    let loadingInterval;

    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const selTahun = document.getElementById('tahun');
      for (let y = now.getFullYear(); y >= 2020; y--) {
        const o = document.createElement('option'); o.value = y; o.textContent = y; selTahun.appendChild(o);
      }
      selTahun.value = now.getFullYear();
      document.getElementById('bulan').selectedIndex = now.getMonth() + 1;
      muatData();
    });

    function mulaiLoading() {
      const wrapper = document.getElementById('loadingWrapper');
      const bar = document.getElementById('loadingBar');
      const text = document.getElementById('persenText');
      
      wrapper.style.display = 'block';
      let progress = 0;
      bar.style.width = '0%';
      text.textContent = '0%';
      
      loadingInterval = setInterval(() => {
        if (progress < 90) {
          progress += 1;
          bar.style.width = progress + '%';
          text.textContent = progress + '%';
        }
      }, 30);
    }

    function selesaiLoading() {
      clearInterval(loadingInterval);
      const wrapper = document.getElementById('loadingWrapper');
      const bar = document.getElementById('loadingBar');
      const text = document.getElementById('persenText');
      
      bar.style.width = '100%';
      text.textContent = '100%';
      
      setTimeout(() => {
        wrapper.style.display = 'none';
      }, 500);
    }

    async function muatData() {
      const bulan = document.getElementById('bulan').value;
      const tahun = document.getElementById('tahun').value;
      if (!bulan) return;
      
      document.getElementById('btnDownload').disabled = true;
      document.getElementById('tbody').innerHTML = '<tr><td colspan="3" class="text-loading">⏳ Memuat data...</td></tr>';
      
      mulaiLoading();
      
      try {
        const res = await fetch(`${API_URL}?action=getAbsensi&year=${tahun}&month=${bulan}`, { cache: 'no-store' });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        const data = json.data || [];
        
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-loading">Tidak ada data wilayah.</td></tr>';
        } else {
          data.forEach((it, i) => {
            const tr = document.createElement('tr');
            const warnaStatus = it.jumlahZip > 0 ? 'lengkap' : 'kosong';
            tr.innerHTML = `
              <td>${i+1}</td>
              <td>${it.jenis === 'Kelurahan' ? 'KEL' : 'DESA'} ${it.desa}</td>
              <td class="${warnaStatus}"><strong>${it.jumlahZip} Laporan</strong></td>
            `;
            tbody.appendChild(tr);
          });
          
          const trTotal = document.createElement('tr');
          trTotal.className = 'total-row';
          trTotal.innerHTML = `<td colspan="2"><strong>TOTAL (${data.length} wilayah)</strong></td><td><strong>${json.total} Laporan</strong></td>`;
          tbody.appendChild(trTotal);
        }
        document.getElementById('btnDownload').disabled = false;
      } catch (err) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="3" class="text-loading" style="color:red;">Gagal: ${err.message}</td></tr>`;
      } finally {
        selesaiLoading();
      }
    }

    async function downloadDanShare() {
      const canvas = await html2canvas(document.getElementById('tabelAbsensi'), { scale: 2, backgroundColor: '#ffffff' });
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const fileName = `Absensi_${document.getElementById('bulan').value}_${document.getElementById('tahun').value}.png`;
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();

      if (navigator.canShare) {
        const file = new File([blob], fileName, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try { 
            await navigator.share({ files: [file], title: 'Absensi ZIP', text: `Absensi ZIP ${document.getElementById('bulan').value} ${document.getElementById('tahun').value}` }); 
            return; 
          } catch(e) {}
        }
      }
      window.open('https://wa.me/?text=' + encodeURIComponent(`Absensi ZIP ${fileName}`), '_blank');
    }
  </script>
</body>
</html>
