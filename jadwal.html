<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e65100">
  <link rel="manifest" href="manifest.json">
  <title>Jadwal Jaga Harian</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 450px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: #ff6f00; color: #fff; padding: 24px; text-align: center; }
    .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
    .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.9; }
    .content { padding: 30px 24px; text-align: center; }
    .label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
    .petugas-utama { background: #e8eaf6; border: 2px solid #1a237e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .petugas-utama .nama { font-size: 22px; font-weight: bold; color: #1a237e; margin-bottom: 6px; }
    .petugas-utama .pangkat { font-size: 14px; color: #e65100; background: #fff; display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; border: 1px solid #e65100; }
    .petugas-besok { background: #f5f5f5; border: 1px dashed #ccc; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .petugas-besok .info { text-align: left; }
    .petugas-besok .nama-besok { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 2px; }
    .petugas-besok .pangkat-besok { font-size: 12px; color: #777; }
    .petugas-besok .icon { font-size: 24px; }
    .footer { background: #f0f4f8; padding: 16px; text-align: center; font-size: 12px; color: #666; display: flex; justify-content: space-between; }
    .footer a { color: #1a237e; text-decoration: none; font-weight: bold; }
    .footer a:hover { text-decoration: underline; }
    .loading { color: #1a237e; font-style: italic; padding: 20px; }
    .error { color: #c62828; font-size: 14px; padding: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Jadwal Jaga Harian</h1>
      <p id="tanggalText">Memuat tanggal...</p>
    </div>
    <div class="content" id="mainContent">
      <div class="loading">⏳ Memuat data personil...</div>
    </div>
    <div class="footer">
      <a href="index.html">⬅️ Absensi</a>
      <a href="admin.html" style="color:#e65100;">✏️ Edit Jadwal</a>
    </div>
  </div>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwrz4o1rJrKaaF3WRF9t6qX5gaP32S4iE8RNIRwBGPU_A6bQmEC84hfL1iaJ2AMLi11/exec';
    document.getElementById('tanggalText').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    async function muatJadwal() {
      const content = document.getElementById('mainContent');
      try {
        const res = await fetch(API_URL + '?action=getJadwal');
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Gagal memuat data');
        content.innerHTML = `
          <div class="label">Petugas Hari Ini</div>
          <div class="petugas-utama">
            <div class="nama">${json.hariIni.nama}</div>
            <div class="pangkat">${json.hariIni.pangkat}</div>
          </div>
          <div class="label" style="margin-top: 20px;">Jadwal Besok</div>
          <div class="petugas-besok">
            <div class="info">
              <div class="nama-besok">${json.besok.nama}</div>
              <div class="pangkat-besok">${json.besok.pangkat}</div>
            </div>
            <div class="icon">📅</div>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="error">❌ ${err.message}<br><br><small>Pastikan file data_pangkat.csv ada di Drive dan formatnya benar.</small></div>`;
      }
    }
    muatJadwal();
  </script>
</body>
</html>
