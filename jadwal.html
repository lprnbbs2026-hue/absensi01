<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e65100">
  <link rel="manifest" href="manifest.json">
  <title>Jadwal Jaga Harian</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 450px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: #ff6f00; color: #fff; padding: 24px; text-align: center; }
    .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
    .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.9; }
    .content { padding: 30px 24px; text-align: center; }
    .label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
    .petugas-utama { background: #e8eaf6; border: 2px solid #1a237e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .petugas-utama .nama { font-size: 18px; font-weight: bold; color: #1a237e; margin-bottom: 4px; }
    .petugas-utama .pangkat { font-size: 12px; color: #e65100; background: #fff; display: inline-block; padding: 2px 8px; border-radius: 20px; border: 1px solid #e65100; }
    .petugas-besok { background: #f5f5f5; border: 1px dashed #ccc; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; text-align:left; }
    .petugas-besok .info { font-size: 14px; font-weight: bold; color: #333; }
    .footer { background: #f0f4f8; padding: 16px; text-align: center; font-size: 12px; color: #666; display: flex; justify-content: space-between; }
    .footer a { color: #1a237e; text-decoration: none; font-weight: bold; }
    .loading { color: #1a237e; font-style: italic; padding: 20px; }
    .error { color: #c62828; font-size: 14px; padding: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Jadwal Jaga Harian</h1>
      <p id="tanggalText">Memuat tanggal...</p>
    </div>
    <div class="content" id="mainContent">
      <div class="loading">⏳ Memuat data...</div>
    </div>
    <div class="footer">
      <a href="index.html">⬅️ Absensi</a>
      <a href="admin.html" style="color:#e65100;">✏️ Input Jadwal</a>
    </div>
  </div>

  <script>
    // URL API BARU
    const API_URL = 'https://script.google.com/macros/s/AKfycbyD8OQXyy8sXWQv-tZi5h0ZuRxpHEsX3y6w--ttE9eLEkpF0qqo8X_pkwTNS1lW2TTc/exec';
    
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    document.getElementById('tanggalText').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    async function muatJadwal() {
      const content = document.getElementById('mainContent');
      try {
        const resManual = await fetch(API_URL + '?action=getJadwalManual');
        const jsonManual = await resManual.json();
        
        let isManual = false;
        let namaManual = '';

        if (jsonManual.success && jsonManual.data) {
          const manualHariIni = jsonManual.data.find(j => j.tanggal === todayStr);
          if (manualHariIni) {
            isManual = true;
            namaManual = manualHariIni.nama;
          }
        }

        const resAuto = await fetch(API_URL + '?action=getJadwal');
        const jsonAuto = await resAuto.json();
        if (!jsonAuto.success) throw new Error(jsonAuto.error);

        let html = '';

        if (isManual) {
          html += `
            <div class="label" style="color:#e65100;">⭐ Jadwal Khusus Hari Ini</div>
            <div class="petugas-utama" style="background:#fff3e0; border-color:#ff6f00;">
              <div class="nama" style="font-size:16px;">${namaManual.replace(/ \| /g, '<br>')}</div>
            </div>
          `;
        } else {
          html += `
            <div class="label">Petugas Hari Ini</div>
            <div class="petugas-utama">
              <div class="nama">${jsonAuto.hariIni.nama}</div>
              <div class="pangkat">${jsonAuto.hariIni.pangkat}</div>
            </div>
          `;
        }

        html += `
          <div class="label" style="margin-top: 20px;">Jadwal Besok (Rotasi)</div>
          <div class="petugas-besok">
            <div class="info">${jsonAuto.besok.nama}</div>
            <div style="font-size:12px;color:#777;">${jsonAuto.besok.pangkat}</div>
          </div>
        `;

        content.innerHTML = html;

      } catch (err) {
        content.innerHTML = `<div class="error">❌ ${err.message}<br><br><small>Pastikan CSV ada di Drive dan API sudah di-deploy ulang.</small></div>`;
      }
    }
    muatJadwal();
  </script>
</body>
</html>
