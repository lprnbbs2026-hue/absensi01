<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a237e">
  <title>Edit Jadwal Jaga</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { text-align: center; color: #1a237e; margin: 0 0 16px; font-size: 20px; }
    .form-group { margin-bottom: 12px; display: flex; gap: 8px; }
    .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .form-group input[type="text"]:first-child { flex: 2; }
    .form-group input[type="text"]:nth-child(2) { flex: 1; }
    .btn-add { background: #2e7d32; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; }
    .list-box { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 16px; max-height: 400px; overflow-y: auto; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .list-item:last-child { border-bottom: none; }
    .list-item:nth-child(even) { background: #fafafa; }
    .list-item strong { color: #1a237e; }
    .btn-del { background: #c62828; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-save { flex: 1; background: #0088cc; color: #fff; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-back { background: #757575; color: #fff; text-decoration: none; padding: 13px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; }
    .status { margin-top: 12px; text-align: center; font-size: 13px; font-weight: bold; }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h2>✏️ Edit Daftar Petugas Jaga</h2>
    <div class="form-group">
      <input type="text" id="inputNama" placeholder="Nama Lengkap">
      <input type="text" id="inputPangkat" placeholder="Pangkat">
      <button class="btn-add" onclick="tambahPersonil()">Tambah</button>
    </div>
    <div class="list-box" id="listBox"></div>
    <div class="actions">
      <button class="btn-save" onclick="simpanKeDrive()" id="btnSave">💾 Simpan ke Google Drive</button>
      <a href="jadwal.html" class="btn-back">⬅️ Kembali</a>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwrz4o1rJrKaaF3WRF9t6qX5gaP32S4iE8RNIRwBGPU_A6bQmEC84hfL1iaJ2AMLi11/exec';
    let dataPersonil = [];

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(API_URL + '?action=getListFull');
        const json = await res.json();
        if (json.success && json.data.length > 0) dataPersonil = json.data;
        renderList();
      } catch(e) { renderList(); }
    });

    function renderList() {
      const listBox = document.getElementById('listBox');
      listBox.innerHTML = '';
      if (dataPersonil.length === 0) {
        listBox.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">Belum ada data personil.</div>';
        return;
      }
      dataPersonil.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<div><strong>${p.nama}</strong><br><span style="font-size:12px;color:#666;">${p.pangkat}</span></div><button class="btn-del" onclick="hapusPersonil(${i})">Hapus</button>`;
        listBox.appendChild(div);
      });
    }

    function tambahPersonil() {
      const nama = document.getElementById('inputNama').value.trim();
      const pangkat = document.getElementById('inputPangkat').value.trim();
      if (!nama || !pangkat) { alert('Nama dan Pangkat wajib diisi!'); return; }
      dataPersonil.push({ nama, pangkat });
      document.getElementById('inputNama').value = '';
      document.getElementById('inputPangkat').value = '';
      renderList();
    }

    function hapusPersonil(index) { dataPersonil.splice(index, 1); renderList(); }

    async function simpanKeDrive() {
      if (dataPersonil.length === 0) { alert('Daftar masih kosong!'); return; }
      let csv = 'Nama,Pangkat\n';
      dataPersonil.forEach(p => { csv += `${p.nama},${p.pangkat}\n`; });
      document.getElementById('btnSave').disabled = true;
      document.getElementById('status').textContent = '⏳ Menyimpan ke Drive...';
      document.getElementById('status').className = 'status';
      try {
        const body = new URLSearchParams();
        body.append('action', 'saveCSV');
        body.append('csvData', csv);
        const res = await fetch(API_URL, { method: 'POST', body });
        const json = await res.json();
        if (json.success) {
          document.getElementById('status').className = 'status success';
          document.getElementById('status').textContent = json.message;
        } else { throw new Error(json.error); }
      } catch (err) {
        document.getElementById('status').className = 'status error';
        document.getElementById('status').textContent = '❌ ' + err.message;
      }
      document.getElementById('btnSave').disabled = false;
    }
  </script>
</body>
</html>
