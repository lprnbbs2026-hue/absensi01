<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jadwal Jaga</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); margin-bottom: 30px; }
    h2 { text-align: center; color: #1a237e; margin: 0 0 16px; font-size: 20px; }
    h3 { font-size: 15px; color: #1a237e; margin-top: 24px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .form-jadwal { background: #e8eaf6; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .form-jadwal input[type="date"] { width: 100%; padding: 12px; border: 1px solid #aaa; border-radius: 6px; margin-bottom: 12px; font-size: 15px; }
    .checkbox-list { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 12px; }
    .checkbox-item { display: flex; align-items: center; padding: 8px; font-size: 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .checkbox-item:last-child { border-bottom: none; }
    .checkbox-item input { margin-right: 12px; transform: scale(1.3); cursor: pointer; }
    .btn-add-jadwal { background: #ff6f00; color: #fff; border: none; border-radius: 6px; padding: 14px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .btn-add-jadwal:hover { background: #e65100; }
    .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; background: #fafafa; margin-bottom: 5px; border-radius: 6px; }
    .saved-date { font-weight: bold; color: #1a237e; }
    .saved-names { color: #555; font-size: 13px; margin-top: 2px; }
    .btn-del { background: #c62828; color: #fff; border: none; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-back { flex: 1; background: #757575; color: #fff; text-decoration: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; }
    .status { margin-top: 12px; text-align: center; font-size: 13px; font-weight: bold; }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h2>✏️ Input Jadwal Jaga</h2>
    <div class="form-jadwal">
      <input type="date" id="inputTanggalManual">
      <div style="font-size: 13px; font-weight: bold; color: #555; margin-bottom: 8px;">Pilih Petugas (Bisa > 1):</div>
      <div class="checkbox-list" id="checkboxList">
        <div style="color:#999; text-align:center; padding:10px;">Memuat data personil...</div>
      </div>
      <button class="btn-add-jadwal" onclick="simpanJadwalManual()" id="btnSimpanManual">💾 Simpan Jadwal Ke Tanggal Ini</button>
    </div>
    <div class="status" id="status"></div>
    <h3>Jadwal Tersimpan</h3>
    <div id="savedList">
      <div style="color:#999; font-size:14px;">Belum ada jadwal manual.</div>
    </div>
    <div class="actions">
      <a href="jadwal.html" class="btn-back">⬅️ Lihat Jadwal Jaga</a>
    </div>
  </div>
  <script>
    // URL API BARU
    const API_URL = 'https://script.google.com/macros/s/AKfycbyD8OQXyy8sXWQv-tZi5h0ZuRxpHEsX3y6w--ttE9eLEkpF0qqo8X_pkwTNS1lW2TTc/exec';

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(API_URL + '?action=getListFull');
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          renderCheckboxPersonil(json.data);
        } else {
          document.getElementById('checkboxList').innerHTML = '<div style="color:#c62828; text-align:center;">Data personil kosong.</div>';
        }
      } catch(e) {
        document.getElementById('checkboxList').innerHTML = '<div style="color:#c62828; text-align:center;">Gagal memuat personil.</div>';
      }
      muatJadwalTersimpan();
    });

    function renderCheckboxPersonil(dataPersonil) {
      const container = document.getElementById('checkboxList');
      container.innerHTML = '';
      dataPersonil.forEach(p => {
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.innerHTML = `<input type="checkbox" value="${p.nama}"> <b>${p.nama}</b> <span style="color:#777;font-size:12px; margin-left:5px;">(${p.pangkat})</span>`;
        container.appendChild(label);
      });
    }

    async function simpanJadwalManual() {
      const tanggal = document.getElementById('inputTanggalManual').value;
      if (!tanggal) { alert('Pilih tanggal terlebih dahulu!'); return; }
      
      const checkboxes = document.querySelectorAll('#checkboxList input[type="checkbox"]:checked');
      if (checkboxes.length === 0) { alert('Pilih minimal 1 petugas!'); return; }
      
      const listNama = Array.from(checkboxes).map(cb => cb.value);
      const namaString = listNama.join(' | ');
      
      document.getElementById('btnSimpanManual').disabled = true;
      document.getElementById('status').textContent = '⏳ Menyimpan jadwal...';
      document.getElementById('status').className = 'status';
      
      try {
        const body = new URLSearchParams();
        body.append('action', 'saveJadwalManual');
        body.append('tanggal', tanggal);
        body.append('nama', namaString);
        
        const res = await fetch(API_URL, { method: 'POST', body });
        const json = await res.json();
        
        if (json.success) {
          document.getElementById('status').className = 'status success';
          document.getElementById('status').textContent = `✅ Jadwal tanggal ${tanggal} tersimpan!`;
          document.getElementById('inputTanggalManual').value = '';
          document.querySelectorAll('#checkboxList input[type="checkbox"]').forEach(cb => cb.checked = false);
          muatJadwalTersimpan();
        } else { throw new Error(json.error); }
      } catch (err) {
        document.getElementById('status').className = 'status error';
        document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
      }
      document.getElementById('btnSimpanManual').disabled = false;
    }

    async function muatJadwalTersimpan() {
      const listContainer = document.getElementById('savedList');
      try {
        const res = await fetch(API_URL + '?action=getJadwalManual');
        const json = await res.json();
        
        if (json.success && json.data && json.data.length > 0) {
          listContainer.innerHTML = '';
          json.data.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
          
          json.data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'saved-item';
            div.innerHTML = `
              <div>
                <div class="saved-date">📅 ${item.tanggal}</div>
                <div class="saved-names">${item.nama.replace(/ \| /g, ', ')}</div>
              </div>
              <button class="btn-del" onclick="hapusJadwal('${item.tanggal}')">Hapus</button>
            `;
            listContainer.appendChild(div);
          });
        } else {
          listContainer.innerHTML = '<div style="color:#999; font-size:14px;">Belum ada jadwal manual tersimpan.</div>';
        }
      } catch (e) {
        listContainer.innerHTML = '<div style="color:#c62828; font-size:14px;">Gagal memuat daftar tersimpan.</div>';
      }
    }

    async function hapusJadwal(tanggal) {
      if (!confirm(`Yakin ingin menghapus jadwal tanggal ${tanggal}?`)) return;
      
      try {
        const body = new URLSearchParams();
        body.append('action', 'hapusJadwalManual');
        body.append('tanggal', tanggal);
        
        const res = await fetch(API_URL, { method: 'POST', body });
        const json = await res.json();
        
        if (json.success) {
          muatJadwalTersimpan();
        } else {
          alert('Gagal menghapus: ' + json.error);
        }
      } catch (e) {
        alert('Terjadi kesalahan jaringan.');
      }
    }
  </script>
</body>
</html>
